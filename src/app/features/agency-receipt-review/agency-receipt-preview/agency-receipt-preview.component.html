<div class="preview-page">
  <div class="toolbar no-print">
    <a class="ghost-btn" routerLink="/agency/receipt-review">返回列表</a>
    <a class="ghost-btn" [routerLink]="['/agency/receipt-review', donationId(), 'edit']">返回編輯</a>
    <button type="button" class="save-btn" (click)="downloadPdf()" [disabled]="!preview()">下載 PDF</button>
  </div>

  @if (isLoading()) {
    <p class="state-text">預覽載入中...</p>
  } @else if (errorText()) {
    <p class="error-text">{{ errorText() }}</p>
  } @else if (preview(); as sheet) {
    @if (isDraft()) {
      <p class="draft-note no-print">這是目前表單內容的預覽。若尚未按「開立收據」或「儲存修正」，捐助者還看不到最新內容。</p>
    }

    <app-donation-receipt-sheet [sheet]="sheet" />
  }
</div>
