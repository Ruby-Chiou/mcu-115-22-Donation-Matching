<div class="preview-page">
  <div class="toolbar no-print">
    @if (donationId()) {
      <app-donation-record-links [donationId]="donationId()" current="receipt" />
    }
    <a class="ghost-btn" routerLink="/agency/receipt-review">返回列表</a>
    <a class="ghost-btn" [routerLink]="['/agency/receipt-review', donationId(), 'edit']">返回編輯</a>
    <button type="button" class="save-btn" (click)="downloadPdf()" [disabled]="!preview() || isDownloading()">
      {{ isDownloading() ? '準備 PDF...' : '下載 PDF' }}
    </button>
  </div>

  @if (isLoading()) {
    <p class="state-text">預覽載入中...</p>
  } @else if (errorText()) {
    <p class="error-text">{{ errorText() }}</p>
  } @else if (preview(); as sheet) {
    @if (isDraft()) {
      <p class="draft-note no-print">這是目前表單內容的預覽。按下載會直接存成加密 PDF。開啟密碼整段遮住，不會出現在這一頁。尚未按「同意開立」前，捐助者的會員收據不會更新。</p>
    }
    @if (downloadError()) {
      <p class="error-text">{{ downloadError() }}</p>
    }

    <app-donation-receipt-sheet [sheet]="sheet" />
  }
</div>
