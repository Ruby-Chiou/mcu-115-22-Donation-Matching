<section class="platform-guide-page">

  <!-- ==========================================
       頁面標題
  ========================================== -->

  <header class="guide-hero">

    <div class="guide-hero-content">


      <h1>
        平台導覽
      </h1>

      <p>
        了解智慧捐助媒合平台的操作方式與使用流程
      </p>

    </div>

  </header>


  <!-- ==========================================
       公共導覽
  ========================================== -->

  <section class="guide-section">

    <app-public-guide></app-public-guide>

  </section>


  <!-- ==========================================
       身分導覽
  ========================================== -->

  <section class="guide-role-section">

    <div class="section-heading">



      <h2>
        依身份查看操作教學
      </h2>

      <p>
        選擇你的使用身份，查看對應的完整操作方式
      </p>

    </div>

    <div class="guide-selector">
      <div class="guide-selector-item">
        <button
          type="button"
          class="guide-selector-button"
          [class.active]="selectedGuide() === 'donor'"
          [attr.aria-expanded]="selectedGuide() === 'donor'"
          (click)="selectGuide('donor')"
        >
          <i class="fa-solid fa-hand-holding-heart"></i>
          <span>捐助者導覽</span>
          <i class="fa-solid fa-chevron-down arrow"></i>
        </button>
        @if (selectedGuide() === 'donor') {
          <div class="guide-selector-content"><app-donor-guide></app-donor-guide></div>
        }
      </div>

      <div class="guide-selector-item">
        <button
          type="button"
          class="guide-selector-button"
          [class.active]="selectedGuide() === 'agency'"
          [attr.aria-expanded]="selectedGuide() === 'agency'"
          (click)="selectGuide('agency')"
        >
          <i class="fa-solid fa-building"></i>
          <span>受助者導覽</span>
          <i class="fa-solid fa-chevron-down arrow"></i>
        </button>
        @if (selectedGuide() === 'agency') {
          <div class="guide-selector-content"><app-agency-guide [currentRole]="currentRole()" /></div>
        }
      </div>
    </div>

  </section>

</section>
