<div class="workspace-title">
  <h1>災害需求列表</h1>
</div>

<div class="switch-area">
  <button
    type="button"
    class="switch-button"
    [class.active]="activeType === 'material'"
    [attr.aria-selected]="activeType === 'material'"
    (click)="selectType('material')"
  >
    物資捐助
  </button>

  <span class="switch-divider" aria-hidden="true"> | </span>

  <button
    type="button"
    class="switch-button"
    [class.active]="activeType === 'helper'"
    [attr.aria-selected]="activeType === 'helper'"
    (click)="selectType('helper')"
  >
    協力需求
  </button>
</div>

<app-disaster-list *ngIf="activeType === 'material'"> </app-disaster-list>

<app-helper-list *ngIf="activeType === 'helper'"> </app-helper-list>
