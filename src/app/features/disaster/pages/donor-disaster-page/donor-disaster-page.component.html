<div class="donor-disaster-page">

  <!-- 災害救助類型切換 -->
  <nav
    class="request-switcher"
    aria-label="災害救助類型">

    <button
      type="button"
      class="switch-button"
      [class.active]="activeType() === 'material'"
      [attr.aria-selected]="activeType() === 'material'"
      (click)="selectType('material')">
      物資捐助
    </button>

    <span
      class="switch-divider"
      aria-hidden="true">
      |
    </span>

    <button
      type="button"
      class="switch-button"
      [class.active]="activeType() === 'helper'"
      [attr.aria-selected]="activeType() === 'helper'"
      (click)="selectType('helper')">
      協力需求
    </button>

    <!-- 右側地圖 -->
    <div class="right-actions">

      <button
        type="button"
        class="switch-button map-button"
        aria-label="前往災害救助地圖"
        (click)="goToMap()">

        <span aria-hidden="true">
          <span class="material-symbols-outlined">
            map
          </span>
        </span>
        地圖
      </button>

    </div>
  </nav>
  <!-- 物資捐助 -->
  @if (activeType() === 'material') {
    <section
      class="needs-section"
      aria-labelledby="material-heading">
      @if (disasterData().isOpen) {
        <h1 id="material-heading">
          物資捐助
        </h1>
      }
      <!-- 篩選區 -->
      <div class="filter-area">
        <!-- 篩選按鈕 -->
        <button
          type="button"
          class="filter-button"
          (click)="showSupplyFilter = !showSupplyFilter"
          title="開啟物資條件篩選">
          <svg
            class="filter-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">
            <polygon
              points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3">
            </polygon>
           <line x1="15" y1="11" x2="21" y2="11"></line>
          <line x1="17" y1="15" x2="21" y2="15"></line>
          <line x1="19" y1="19" x2="21" y2="19"></line>
          </svg>
          <span>
            篩選
          </span>
          <!-- 展開 / 收合 -->
          <span class="filter-arrow">
            {{ showSupplyFilter ? '▲' : '▼' }}
          </span>
        </button>
        <!-- 物資篩選元件 -->
        @if (showSupplyFilter) {
          <app-donor-disaster-supply-filter
            [filters]="materialFilters"
            (filtersChange)="materialFilters = $event">
          </app-donor-disaster-supply-filter>
        }
      </div>
      <!-- 物資需求卡片 -->
      <app-donor-disaster-card-list
        type="material"
        [filters]="materialFilters">
      </app-donor-disaster-card-list>
    </section>
  }
 <!-- ==================== -->
  <!-- 協力需求 -->
  <!-- ==================== -->
  @else {
    <section
      class="needs-section"
      aria-labelledby="helper-heading">

      <h1 id="helper-heading">
        協力需求
      </h1>
      <!-- 協力者篩選 -->
    <div class="filter-area">
      <button
        type="button"
        class="filter-button"
        (click)="showHelperFilter = !showHelperFilter"
        title="開啟協力條件篩選">
        <svg
          class="filter-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">
          <polygon
            points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3">
          </polygon>

          <line x1="15" y1="11" x2="21" y2="11"></line>
          <line x1="17" y1="15" x2="21" y2="15"></line>
          <line x1="19" y1="19" x2="21" y2="19"></line>
        </svg>
        <span>
          篩選
        </span>
        <!-- 展開 / 收合 -->
        <span class="filter-arrow">
          {{ showHelperFilter ? '▲' : '▼' }}
        </span>

      </button>


      <!-- 協力者篩選元件 -->
      @if (showHelperFilter) {

        <app-donor-disaster-helper-filter
          [filters]="helperFilters"
          (filtersChange)="helperFilters = $event">
        </app-donor-disaster-helper-filter>

      }

    </div>
      <!-- 協力需求卡片 -->
      <app-donor-disaster-card-list
        type="helper"
        [filters]="helperFilters">
      </app-donor-disaster-card-list>

    </section>

  }

</div>
