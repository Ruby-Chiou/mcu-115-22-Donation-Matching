<div class="verify-page">
  <div class="page-heading">
    <h1>受助者身分審查</h1>
    <p>
      資格不是寄確認信、對方點了就算通過。請用註冊資料到公開可查的社福網站核對機構是否存在，再撥打該網站公布的電話，確認註冊人存在，以及對方是否向本平台註冊。三項都對上才可以通過。
    </p>
  </div>

  <section class="stats-grid">
    <button type="button" class="stat-card" [class.active]="selectedStatus === 'pending'" (click)="toggleStatus('pending')">
      <span class="stat-icon pending-icon">◷</span>
      <span class="stat-content">
        <span class="stat-label">待審核申請</span>
        <strong>{{ count('pending') }}</strong>
        <span class="stat-hint">等待公開資料與電話核對</span>
      </span>
    </button>
    <button type="button" class="stat-card" [class.active]="selectedStatus === 'approved'" (click)="toggleStatus('approved')">
      <span class="stat-icon approved-icon">✓</span>
      <span class="stat-content">
        <span class="stat-label">已驗證機構</span>
        <strong>{{ count('approved') }}</strong>
        <span class="stat-hint">公開資料與電話都已確認</span>
      </span>
    </button>
    <button type="button" class="stat-card" [class.active]="selectedStatus === 'supplement'" (click)="toggleStatus('supplement')">
      <span class="stat-icon supplement-icon">!</span>
      <span class="stat-content">
        <span class="stat-label">待補件</span>
        <strong>{{ count('supplement') }}</strong>
        <span class="stat-hint">需要補充資料</span>
      </span>
    </button>
    <button type="button" class="stat-card" [class.active]="selectedStatus === 'rejected'" (click)="toggleStatus('rejected')">
      <span class="stat-icon rejected-icon">×</span>
      <span class="stat-content">
        <span class="stat-label">未通過</span>
        <strong>{{ count('rejected') }}</strong>
        <span class="stat-hint">未符合審核要求</span>
      </span>
    </button>
  </section>

  @if (loadError) {
    <p class="load-error">{{ loadError }}</p>
  }

  <app-agency-review-list
    [applications]="filteredApplications()"
    [(keyword)]="searchKeyword"
    [(status)]="selectedStatus"
    [cancellingId]="cancellingId"
    (openApplication)="openApplication($event)"
    (cancelAccount)="cancelAccount($event)"
  />
</div>

@if (selectedApplication) {
  <app-agency-review-detail
    [application]="selectedApplication"
    [cancelling]="cancellingId === selectedApplication.id"
    (closed)="closeApplication()"
    (reviewed)="reviewApplication($event)"
    (cancelled)="cancelAccount($event)"
  />
}
