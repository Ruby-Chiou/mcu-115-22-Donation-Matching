<div class="thank-you-page">
  <h1 class="page-title">感謝牆</h1>

  <app-thank-you-list></app-thank-you-list>

  <section class="blacklist-section" aria-labelledby="blacklist-heading">
    <div class="blacklist-panel">
      <div class="blacklist-header">
        <h2 id="blacklist-heading" class="blacklist-title">黑名單公告</h2>
        @if (!blacklistLoaded()) {
          <button type="button" class="blacklist-load-btn" (click)="loadBlacklist()" [disabled]="blacklistLoading()">
            {{ blacklistLoading() ? '載入中…' : '查看黑名單' }}
          </button>
        }
      </div>

      @if (blacklistLoaded()) {
        <div class="blacklist-list">
          @for (item of blacklist(); track item.id) {
            <div class="blacklist-item">
              <div class="blacklist-user">{{ item.headline || '未提供名稱' }}</div>
              <div class="blacklist-reason">{{ item.body }}</div>
            </div>
          } @empty {
            <p class="wall-empty">目前沒有黑名單公告。</p>
          }
        </div>
      }
    </div>
  </section>
</div>
