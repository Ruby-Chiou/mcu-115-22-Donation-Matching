<div class="container">

  <div class="sidebar">
    <h1>捐助地圖</h1>
    <h3><i class="fa-solid fa-triangle-exclamation"></i>僅提供受助單位註冊地址</h3>
    <h3>非可送貨之地點</h3>

    <select
      class="location-select"
      (change)="selectCity($event)"
    >
      <option value="">請選擇縣市</option>

      @for(city of cityList; track city.name) {
        <option [value]="city.name">
          {{ city.name }}
        </option>
      }
    </select>
  </div>

  <div id="map"></div>

</div>
