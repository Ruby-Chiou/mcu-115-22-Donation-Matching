@if (isLoading()) {
  <p class="state-text">收據載入中...</p>
} @else if (errorText()) {
  <p class="state-text error">{{ errorText() }}</p>
} @else {
  @if (downloadError()) {
    <p class="state-text error">{{ downloadError() }}</p>
  }
  <ul class="receipt-grid">
    @for (receipt of receiptService.receipts(); track receipt.id) {
      <li class="receipt-card">
        <app-donation-receipt-sheet [sheet]="receipt" />

        <div class="card-actions no-print">
          <p class="download-hint">開啟密碼是身分證字號，按鈕會直接下載檔案。</p>
          <button type="button" class="btn btn-primary" [disabled]="downloadingId() === receipt.id" (click)="downloadPdf(receipt)">
            <i class="fa-solid fa-file-pdf"></i> {{ downloadingId() === receipt.id ? '準備 PDF...' : '下載 PDF' }}
          </button>
        </div>
      </li>
    } @empty {
      <li class="state-text">尚無收據。捐贈時若勾選「需要收據」，機構確認後會出現在此。</li>
    }
  </ul>
}
