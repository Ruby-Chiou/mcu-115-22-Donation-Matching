<section class="login-shell">
  <ng-container *ngIf="showRoleModal; else formView">
    <div class="role-page">
      <app-role-selector
        title="請選擇登入身份"
        description="捐助者可進行捐贈；受助者為社福團體與機構。"
        (roleSelected)="selectRole($event)"
      >
      </app-role-selector>
    </div>
  </ng-container>

  <ng-template #formView>
    <div class="form-card">
      <!-- 捐助者登入表單 -->
      <form *ngIf="!isForgotPasswordStep && !isRecipient" class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-header">
          <div>
            <h2>{{ roleHeading }}</h2>
            <p>{{ roleDescription }}</p>
          </div>
          <button type="button" class="ghost-btn" (click)="backToRoleSelection()">切換身份</button>
        </div>

        <div class="social-login">
          <div class="social-row">
            <p>或使用其它應用登入帳號</p>
            <div class="social-buttons">
              <button type="button" class="social-btn google">Google<i class="fa-brands fa-google" style="color: #4285f4"></i></button>
              <button type="button" class="social-btn line">LINE<i class="fa-brands fa-line" style="color: #06c755"></i></button>
              <button type="button" class="social-btn facebook">
                Facebook<i class="fa-brands fa-facebook" style="color: #1877f2"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="input-grid">
          <label class="field full">
            <span>電子信箱</span>
            <input type="email" [(ngModel)]="loginForm.email" name="email" required />
          </label>

          <label class="field full">
            <span>密碼</span>
            <input type="password" [(ngModel)]="loginForm.password" name="password" required />
          </label>
        </div>

        <div class="actions">
          <label class="remember">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span>記住我</span>
          </label>

          <div class="action-links">
            <a routerLink="/register" class="link-btn">尚未註冊帳號？</a>
            <button type="button" class="link-btn" (click)="goToForgotPassword()">忘記密碼？</button>
          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="primary-btn">登入</button>
        </div>

        <p class="submit-message" *ngIf="submitMessage">{{ submitMessage }}</p>
      </form>

      <!-- 受助者（憑證PIN碼）登入表單 -->
      <form *ngIf="!isForgotPasswordStep && isRecipient" class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-header">
          <div>
            <h2>{{ roleHeading }}</h2>
            <p>{{ roleDescription }}</p>
          </div>
          <button type="button" class="ghost-btn" (click)="backToRoleSelection()">切換身份</button>
        </div>

        <div class="input-grid">
          <label class="field full">
            <span>憑證PIN碼</span>
            <input type="password" [(ngModel)]="loginForm.credentialPin" name="credentialPin" placeholder="輸入您的PIN碼" required />
          </label>
        </div>

        <div class="actions">
          <div class="action-links">
            <a routerLink="/register" class="link-btn">尚未註冊帳號？</a>
          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="primary-btn">驗證登入</button>
        </div>

        <p class="submit-message" *ngIf="submitMessage">{{ submitMessage }}</p>
      </form>

      <!-- 忘記密碼表單（僅限捐助者） -->
      <form *ngIf="isForgotPasswordStep" class="login-form" (ngSubmit)="onSubmitForgotPassword()">
        <div class="form-header">
          <div>
            <h2>重設密碼</h2>
            <p>請輸入您的電子信箱，我們將寄送密碼重設連結。</p>
          </div>
          <button type="button" class="ghost-btn" (click)="backToLogin()">返回登入</button>
        </div>

        <div class="input-grid">
          <label class="field full">
            <span>電子信箱</span>
            <input type="email" [(ngModel)]="forgotPasswordForm.email" name="forgotEmail" required />
          </label>
        </div>

        <div class="actions">
          <div class="action-links">
            <button type="button" class="link-btn" (click)="backToLogin()">返回登入</button>
          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="primary-btn">寄送重設連結</button>
        </div>

        <p class="submit-message" *ngIf="submitMessage">{{ submitMessage }}</p>
      </form>
    </div>
  </ng-template>
</section>
