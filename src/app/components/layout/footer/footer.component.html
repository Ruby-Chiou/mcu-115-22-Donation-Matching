<footer>




  <!-- 頁尾 -->

  <div class="footer-main">

    <div class="footer-container">

      <!-- 平台資訊 -->
      <div class="footer-column footer-about">
  <h3>智慧捐助媒合平台</h3>

  <img
    src="assets/images/logo_w2.png"
    alt="智慧捐助媒合平台 Logo"
    class="footer-logo"
  />
</div>


      <!-- 客服與協助 -->
      <div class="footer-column">
        <h3>客服與協助</h3>

        <a routerLink="/customer-service/ai-chat">
          <i class="fa-solid fa-headset"></i>
          AI客服
        </a>

        <a routerLink="/customer-service/faq">
          <i class="fa-solid fa-users"></i>
          常見問題
        </a>

        <a routerLink="/contact-us">
          <i class="fa-solid fa-envelope"></i>
          聯絡我們
        </a>
      </div>


      <!-- 快速連結 -->
      <div class="footer-column">
        <h3>快速連結</h3>

        <a routerLink="/donor/daily">
          日常捐助
        </a>

        <a routerLink="/donor/disaster">
          災害救助
        </a>

        <a routerLink="/thank-you-wall">
          捐助感謝
        </a>

        <a routerLink="/daily/locations">
          捐助地圖
        </a>

        <a routerLink="/donor/beneficiaries">
          受助機構
        </a>

        <a routerLink="/intro">
          平台介紹
        </a>

        <a routerLink="/platform-guide">
          平台導覽
        </a>
      </div>


      <!-- 平台服務 -->
      <div class="footer-column">
        <h3>平台服務</h3>

        @if (!signedIn) {
          <a routerLink="/login">
            <i class="fa-solid fa-right-to-bracket"></i>
            登入
          </a>

          <a routerLink="/register">
            <i class="fa-solid fa-user-plus"></i>
            註冊
          </a>
        }

        <a [routerLink]="auth.principal().role === 'agency' ? '/agency/profile' : '/member'">
          <i class="fa-solid fa-id-card"></i>
          {{ auth.principal().role === 'agency' ? '機構資料' : auth.principal().role === 'admin' ? '客訴信箱' : '會員專區' }}
        </a>


      </div>

    </div>

  </div>



  <!-- Footer 最底層 -->

  <div class="footer-bottom">

    <div class="footer-bottom-container">

      <div class="footer-links">
        <a routerLink="/legal/privacy">隱私權政策</a>
        <span>|</span>
        <a routerLink="/legal/terms">網站使用條款</a>
        <span>|</span>
        <a routerLink="/legal/security">網站安全政策</a>
      </div>

      <div class="copyright">
        © 2026 智慧捐助媒合平台
      </div>

    </div>

  </div>
</footer>
