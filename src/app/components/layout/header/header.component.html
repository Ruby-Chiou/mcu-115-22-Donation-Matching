<header [class.header-hidden]="isHeaderHidden">
  <div class="container">
    <div class="nav-wrapper">
      <div class="left">

  <a routerLink="" class="logo-link">
    <img
      src="assets/images/logo.png"
      alt="智慧捐助媒合平台 Logo"
      class="site-logo"
    />
  </a>

  <p class="nav-name" routerLink="">
    智慧捐助媒合平台
  </p>

</div>

      <div class="center">
        <nav>
          @for (item of navItems; track item.name) {
          <div class="nav-item-with-dropdown">
            <a [routerLink]="item.link">{{ item.name }} <i class="fa-solid fa-chevron-down arrow"></i></a>
            <ul class="dropdown-menu">
              @for (sub of item.sub; track sub.name) {
              <li><a [routerLink]="sub.link">{{ sub.name }}</a></li>
              }
            </ul>
          </div>
          }
        </nav>
      </div>

      <div class="right">
        <a routerLink="/login">登入</a>
        <span>|</span>
        <a routerLink="/register">註冊</a>
        <span>|</span>
        <a routerLink="/member">會員專區</a>
        <a class="bell-link" routerLink="/member" [queryParams]="{ tab: 'inbox' }" aria-label="收件匣">
          <i class="fa-solid fa-bell"></i>
          @if (messageService.unreadCount() > 0) {
            <span class="bell-badge">{{ messageService.unreadCount() > 99 ? '99+' : messageService.unreadCount() }}</span>
          }
        </a>
      </div>
    </div>
  </div>
</header>
