<div class="home-info-grid">
<section class="platform-announcements">

  <div class="announcement-title">

    <i class="fa-solid fa-bullhorn"></i>

    <span>平台公告</span>

  </div>


  <div class="announcement-list">

    @for (item of announcements; track item.date + item.text) {
    <div class="announcement-item">

      <span class="announcement-date">
        {{ item.date }}
      </span>

      <span class="announcement-text">
        {{ item.text }}
      </span>

    </div>
    }

  </div>

</section>

<section class="latest-news-section">

  <div class="latest-news-header">

    <div class="latest-news-title">

      <i class="fa-solid fa-newspaper"></i>

      <div>
        <h2>最新消息</h2>

        <p>
          掌握平台目前的重要資訊與最新動態
        </p>
      </div>

    </div>

  </div>


  <div class="latest-news-list">

    @for (news of latestNewsList; track news.title) {

      <a
        [routerLink]="news.link"
        class="latest-news-item"
      >

        <div class="latest-news-date">
          {{ news.date }}
        </div>


        <div class="latest-news-category">
          {{ news.category }}
        </div>


        <div class="latest-news-content">

          <h3>
            {{ news.title }}
          </h3>

          <p>
            {{ news.content }}
          </p>

        </div>


        <div class="latest-news-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </a>

    }

  </div>

</section>
</div>
