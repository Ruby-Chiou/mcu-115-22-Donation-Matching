<!-- ========================================== -->
  <!-- 感謝跑馬燈 -->
  <!-- ========================================== -->
  @if (marqueeItems().length && !finished()) {
  <div
  class="global-thanks-bar"
  [class.marquee-top]="isHeaderHidden"
>
    <div class="thanks-track">
      <div class="thanks-content" [style.animation-duration.s]="scrollSeconds()" (animationend)="onMarqueeEnd($event)">
        @for (item of marqueeItems(); track item.id) {
          <div class="thanks-item">
            <i class="fa-solid fa-heart"></i>
            <span>感謝 <strong>{{ item.displayName }}</strong> 寄出 {{ item.donationItem }}</span>
          </div>
        }
      </div>
    </div>
  </div>
  }
