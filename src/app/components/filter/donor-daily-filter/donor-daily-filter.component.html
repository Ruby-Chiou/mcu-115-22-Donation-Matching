<app-filter-base
  [options]="[
    { key: '類別', values: categoryOptions },
    { key: '需求對象', values: targetOptions },
    { key: '地區', values: regionOptions },
    { key: '接收方式', values: receiveMethodOptions },
    { key: '緊急優先度', values: priorityMethodOptions }
  ]"
  (filterChange)="filterChange.emit($event)"
>
  <!-- 注意這裡直接用 filterChange -->
</app-filter-base>
