<div class="helper-filter">
  @if (showCityFilter) {
    <div class="filter-group">
      <h3>依縣市</h3>
      <div class="pill-list" role="group" aria-label="縣市多選">
        @for (city of cityOptions; track city) {
          <button
            type="button"
            class="pill-btn"
            [class.active]="filters.cities.includes(city)"
            (click)="toggleCity(city)"
          >
            {{ city }}
          </button>
        }
      </div>
    </div>
  }

  <div class="filter-group">
    <h3>依服務類型</h3>
    <div class="pill-list">
      @for (option of helperTypeOptions; track option) {
        <button
          type="button"
          class="pill-btn"
          [class.active]="filters.helperType.includes(option)"
          (click)="toggleHelperType(option)"
        >
          {{ option }}
        </button>
      }
    </div>
  </div>

  <div class="filter-group">
    <h3>依服務地點</h3>
    <div class="pill-list">
      @for (option of helperLocationOptions; track option) {
        <button
          type="button"
          class="pill-btn"
          [class.active]="filters.helperLocation.includes(option)"
          (click)="toggleHelperLocation(option)"
        >
          {{ option }}
        </button>
      }
    </div>
  </div>

  <div class="filter-footer">
    <button type="button" class="reset-btn" (click)="resetFilters()">重置篩選</button>
  </div>
</div>
