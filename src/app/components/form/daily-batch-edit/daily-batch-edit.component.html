<div class="container">
  <h1>批次編輯日常需求內容</h1>

  <ng-container *ngFor="let demand of editDemands; let i = index">
    <!-- 需求編號：移到藍色大框框外面 -->
    <div class="batch-edit-header" *ngIf="demand.id">
      <div class="info-tag">
        <span class="info-label">需求編號</span>
        <span class="info-value">A{{ demand.id }}</span>
      </div>
    </div>

    <!-- 藍色大框框 -->
    <div class="form-box" [ngClass]="i % 2 === 0 ? 'light-box' : 'dark-box'">
      <!-- 後面原本 b 版的內容全部放這裡 -->

      <!-- 需求物 -->
      <label class="label-row">
        需求物
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.item"> {{ demand.item.length }}/150 </span>
      </label>

      <textarea
        class="item-input"
        maxlength="150"
        [class.invalid]="demand.itemError"
        placeholder="請編輯需求物"
        [(ngModel)]="demand.item"
      ></textarea>

      <!-- 需求數量與單位 -->
      <label class="label-row">
        需求數量
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.amount"> {{ demand.amount.toString().length }}/10 </span>
      </label>

      <div class="amount-box">
        <input
          class="short-input"
          maxlength="10"
          [class.invalid]="demand.amountError"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="請編輯數量"
          [(ngModel)]="demand.amount"
          (input)="limitNumberLength($event, demand, 'amount')"
        />

        <input
          class="unit-input"
          maxlength="10"
          [class.invalid]="demand.unitError"
          type="text"
          placeholder="請編輯單位，例如：箱、袋、包"
          [(ngModel)]="demand.unit"
        />
      </div>

      <!-- 剩餘需求 -->
      <label class="label-row">
        剩餘需求
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.remaining"> {{ demand.remaining.toString().length }}/10 </span>
      </label>

      <div class="amount-box">
        <input
          class="short-input"
          maxlength="10"
          [class.invalid]="demand.remainingError"
          type="text"
          inputmode="numeric"
          placeholder="請輸入目前剩餘需求"
          [(ngModel)]="demand.remaining"
          (input)="limitNumberLength($event, demand, 'remaining')"
        />

        <input class="unit-input" type="text" [value]="demand.unit" disabled />
      </div>

      <!-- 數量描述 -->
      <label class="label-row">
        數量描述
        <span class="word-count" *ngIf="demand.amountDescription"> {{ demand.amountDescription.length }}/100 </span>
      </label>

      <div class="short-field">
        <textarea
          maxlength="100"
          placeholder="請編輯數量描述，例如：1箱內含10包，每包5公斤"
          [(ngModel)]="demand.amountDescription"
        ></textarea>
      </div>

      <label class="label-row">
        類別
        <span class="required">*</span>
      </label>

      <div class="short-field category-field">
        <div class="custom-select" [class.error-input]="demand.categoryError">
          <button type="button" class="custom-select-trigger" (click)="toggleCategoryDropdown(i)">
            <span>{{ demand.category || '請選擇類別' }}</span>
            <span class="dropdown-arrow">▼</span>
          </button>

          <div class="custom-select-options" *ngIf="categoryDropdownIndex === i">
            <button type="button" class="custom-option" *ngFor="let category of categoryOptions" (click)="selectCategory(demand, category)">
              {{ category }}
            </button>
          </div>
        </div>
      </div>

      <!-- 需求原因 -->
      <label class="label-row">
        需求原因
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.reason"> {{ demand.reason.length }}/300 </span>
      </label>

      <textarea maxlength="300" [class.invalid]="demand.reasonError" placeholder="請編輯需求原因" [(ngModel)]="demand.reason"></textarea>

      <!-- 需求描述 -->
      <label class="label-row">
        需求描述
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.description"> {{ demand.description.length }}/500 </span>
      </label>

      <textarea
        maxlength="500"
        [class.invalid]="demand.descriptionError"
        placeholder="請編輯需求描述，例如可接受誤差程度、特定型號、款式等"
        [(ngModel)]="demand.description"
      ></textarea>

      <!-- 特殊品牌需求 -->
      <label class="label-row">
        特殊品牌需求
        <span class="word-count"> {{ demand.brand?.length || 0 }}/100 </span>
      </label>

      <textarea
        maxlength="100"
        placeholder="請編輯特殊品牌需求，例如：不限品牌、指定品牌、不可接受哪些品牌"
        [(ngModel)]="demand.brand"
      ></textarea>

      <!-- 物資示意圖片 -->
      <label class="label-row"> 物資示意圖片 </label>

      <div class="image-upload-box">
        <div class="image-upload-area">
          <!-- 未滿 5 張才顯示選擇圖片 -->
          <ng-container *ngIf="(imageFiles[demand.id] || []).length < 5">
            <div class="upload-controls">
              <label class="image-upload-btn">
                <i class="fa-solid fa-image"></i>
                選擇圖片

                <input type="file" accept="image/*" (change)="onImageSelected($event, demand)" />
              </label>

              <span class="image-upload-hint"> 可上傳 JPG、PNG 等圖片，大小上限 5MB </span>
            </div>
          </ng-container>

          <div class="selected-image-list" *ngIf="(imageFiles[demand.id] || []).length > 0">
            <div class="selected-image" *ngFor="let image of (imageFiles[demand.id] || []); let j = index">
              <!-- 圖片名稱：點擊可預覽 -->
              <button type="button" class="selected-image-name" (click)="openImagePreview(demand, j)">{{ image.name }}</button>

              <button type="button" class="remove-image-btn" (click)="removeImage(demand, j)">移除圖片</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 需求對象區塊 -->
      <div class="service-target-area" [class.invalid-box]="demand.serviceTargetError">
        <!-- 左側 固定需求對象 -->
        <div class="service-target-section">
          <label class="label-row align-title">
            需求對象
            <span class="required">*</span>
          </label>

          <div class="service-target-box">
            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['老人']" />
              老人
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['嬰幼兒']" />
              嬰幼兒
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['孩童']" />
              孩童
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['青少年']" />
              青少年
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['身障']" />
              身障
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['貧困']" />
              貧困
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['重症照護']" />
              重症照護
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['動物']" />
              動物
            </label>

            <label>
              <input type="checkbox" [(ngModel)]="demand.serviceTargets['無家者']" />
              無家者
            </label>
          </div>
        </div>

        <!-- 右側 自訂需求對象 -->
        <div class="custom-service-target-section">
          <label class="label-row align-title"> 其他需求對象 </label>

          <div class="custom-service-list">
            <div
              class="custom-service-row"
              *ngFor="
          let target of demand.customServiceTargets;
          let j = index;
          trackBy: trackByIndex
        "
            >
              <input
                class="custom-service-input"
                maxlength="50"
                placeholder="請編輯其他需求對象(可自行輸入)"
                [(ngModel)]="demand.customServiceTargets[j]"
              />

              <span class="word-count" *ngIf="target"> {{ target.length }}/50 </span>

              <button
                type="button"
                class="add-condition-btn"
                *ngIf="
            target &&
            demand.customServiceTargets.length < 5
          "
                (click)="addCustomServiceTarget(demand)"
              >
                ＋
              </button>

              <button
                type="button"
                class="delete-condition-btn"
                *ngIf="demand.customServiceTargets.length > 1"
                (click)="removeCustomServiceTarget(demand, j)"
              >
                －
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 物資狀態區 -->
      <div class="condition-area">
        <!-- 左側 接受物資需求狀態 -->
        <div class="condition-section">
          <label class="label-row align-title condition-title"> 接受物資需求狀態 </label>

          <div class="condition-hint">
            <span class="hint-item">
              初始：
              <span class="hint-icon unset">―</span>
              未設定
            </span>

            <span class="hint-item">
              點一下：
              <span class="hint-icon accept">✔</span>
              接受
            </span>

            <span class="hint-item">
              點兩下：
              <span class="hint-icon reject">✘</span>
              不接受
            </span>
          </div>

          <div class="condition-left">
            <div class="condition-row">
              <span class="condition-name">全新</span>
              <button
                type="button"
                class="condition-toggle"
                [class.accept]="demand.conditions['全新'] === '接受'"
                [class.reject]="demand.conditions['全新'] === '不接受'"
                (click)="toggleCondition(demand, '全新')"
              >
                {{ getConditionIcon(demand.conditions['全新']) }}
              </button>
            </div>

            <div class="condition-row">
              <span class="condition-name">二手</span>
              <button
                type="button"
                class="condition-toggle"
                [class.accept]="demand.conditions['二手'] === '接受'"
                [class.reject]="demand.conditions['二手'] === '不接受'"
                (click)="toggleCondition(demand, '二手')"
              >
                {{ getConditionIcon(demand.conditions['二手']) }}
              </button>
            </div>

            <div class="condition-row">
              <span class="condition-name">有擦痕</span>
              <button
                type="button"
                class="condition-toggle"
                [class.accept]="demand.conditions['有擦痕'] === '接受'"
                [class.reject]="demand.conditions['有擦痕'] === '不接受'"
                (click)="toggleCondition(demand, '有擦痕')"
              >
                {{ getConditionIcon(demand.conditions['有擦痕']) }}
              </button>
            </div>

            <div class="condition-row">
              <span class="condition-name">過期</span>
              <button
                type="button"
                class="condition-toggle"
                [class.accept]="demand.conditions['過期'] === '接受'"
                [class.reject]="demand.conditions['過期'] === '不接受'"
                (click)="toggleCondition(demand, '過期')"
              >
                {{ getConditionIcon(demand.conditions['過期']) }}
              </button>
            </div>

            <div class="condition-row">
              <span class="condition-name">毀損</span>
              <button
                type="button"
                class="condition-toggle"
                [class.accept]="demand.conditions['毀損'] === '接受'"
                [class.reject]="demand.conditions['毀損'] === '不接受'"
                (click)="toggleCondition(demand, '毀損')"
              >
                {{ getConditionIcon(demand.conditions['毀損']) }}
              </button>
            </div>
          </div>
        </div>

        <!-- 右側 自訂狀態 -->
        <div class="custom-condition-section">
          <label class="label-row"> 其他物資需求狀態</label>

          <div class="custom-condition-list">
            <div class="custom-condition-row" *ngFor="let condition of demand.customConditions; let j = index; trackBy: trackByIndex">
              <input
                class="custom-condition-input"
                maxlength="100"
                type="text"
                placeholder="請編輯其他物資需求狀態(可自行輸入)"
                [(ngModel)]="demand.customConditions[j]"
              />

              <span class="word-count" *ngIf="condition"> {{ condition.length }}/100 </span>

              <!-- 新增按鈕 -->
              <button
                type="button"
                class="add-condition-btn"
                *ngIf="condition && demand.customConditions.length < 5"
                (click)="addCustomCondition(demand)"
              >
                ＋
              </button>

              <!-- 刪除按鈕 -->
              <button
                type="button"
                class="delete-condition-btn"
                *ngIf="demand.customConditions.length > 1"
                (click)="removeCustomCondition(demand, j)"
              >
                －
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 緊急優先度 -->
      <label class="label-row align-title">
        緊急優先度
        <span class="required">*</span>

        <span class="priority-limit-info"> 普通：上架60天｜緊急：上架30天｜非常緊急：上架14天 </span>
      </label>

      <div class="priority-box">
        <label class="normal">
          <input type="radio" [name]="'priority' + i" value="普通" [(ngModel)]="demand.priority" />
          普通
        </label>

        <label class="urgent">
          <input type="radio" [name]="'priority' + i" value="緊急" [(ngModel)]="demand.priority" />
          緊急
        </label>

        <label class="very-urgent">
          <input type="radio" [name]="'priority' + i" value="非常緊急" [(ngModel)]="demand.priority" />
          非常緊急
        </label>
      </div>

      <!-- 公開狀態 -->
      <label class="label-row align-title">
        公開狀態
        <span class="required">*</span>
      </label>

      <div class="status-box">
        <label>
          <input type="radio" [name]="'status' + i" value="上架" [(ngModel)]="demand.status" />
          上架
        </label>

        <label>
          <input type="radio" [name]="'status' + i" value="隱藏" [(ngModel)]="demand.status" />
          隱藏
        </label>

        <label>
          <input type="radio" [name]="'status' + i" value="下架" [(ngModel)]="demand.status" />
          下架
        </label>
      </div>

      <!-- 接收方式 -->
      <label class="label-row">
        接收方式
        <span class="required">*</span>
      </label>

      <div class="receive-method-box" [class.invalid-box]="demand.invalidReceiveInfo">
        <label>
          <input type="checkbox" [(ngModel)]="demand.receiveMethod['寄送']" />
          寄送
        </label>

        <label>
          <input type="checkbox" [(ngModel)]="demand.receiveMethod['面交']" />
          面交
        </label>
      </div>

      <!-- 接收資訊：固定顯示 -->
      <div class="receive-info-box">
        <!-- 收件人 -->
        <label class="label-row">
          收件人
          <span class="required">*</span>

          <span class="word-count" *ngIf="demand.recipient"> {{ demand.recipient.length }}/30 </span>
        </label>

        <input
          class="phone-input"
          maxlength="30"
          [class.invalid]="demand.invalidReceiveInfo && !demand.recipient"
          type="text"
          placeholder="請編輯收件人姓名"
          [(ngModel)]="demand.recipient"
        />

        <!-- 接收物資地址 -->
        <label class="label-row">
          接收物資地址
          <span class="required">*</span>

          <span class="word-count" *ngIf="demand.address"> {{ demand.address.length }}/35 </span>
        </label>

        <input
          class="medium-input"
          maxlength="35"
          [class.invalid]="demand.invalidReceiveInfo && !demand.address"
          type="text"
          placeholder="請編輯接收物資地址"
          [(ngModel)]="demand.address"
        />
      </div>

      <label class="label-row">
        聯絡電話
        <span class="required">*</span>

        <span class="word-count" *ngIf="demand.phone"> {{ demand.phone.length }}/30 </span>
      </label>

      <input
        class="phone-input"
        maxlength="30"
        type="tel"
        [class.invalid]="demand.phoneError"
        placeholder="請編輯可保持暢通的號碼"
        [(ngModel)]="demand.phone"
      />
      <!-- 聯絡時間 -->
      <label class="label-row contact-time-title"> 聯絡時間 </label>

      <div class="contact-time-box">
        <!-- 日期 -->
        <div class="contact-time-section">
          <span class="contact-time-label"> 日期 </span>

          <div class="contact-time-options">
            <label class="time-option">
              <input type="checkbox" value="平日" [(ngModel)]="demand.contactTimeWeekday" />
              平日
            </label>

            <label class="time-option">
              <input type="checkbox" value="假日" [(ngModel)]="demand.contactTimeWeekend" />
              假日
            </label>
          </div>
        </div>
        <!-- 時段 -->
        <div class="contact-time-section">
          <span class="contact-time-label"> 時段 </span>

          <div class="contact-time-options">
            <label class="time-option">
              <input type="checkbox" value="上午" [(ngModel)]="demand.contactTimeMorning" />
              上午
              <span class="time-range"> 08:00～12:00 </span>
            </label>

            <label class="time-option">
              <input type="checkbox" value="下午" [(ngModel)]="demand.contactTimeAfternoon" />
              下午
              <span class="time-range"> 12:00～18:00 </span>
            </label>

            <label class="time-option">
              <input type="checkbox" value="晚上" [(ngModel)]="demand.contactTimeEvening" />
              晚上
              <span class="time-range"> 18:00～22:00 </span>
            </label>
          </div>
        </div>
      </div>
      <!-- 其他說明 -->
      <label class="label-row">
        其他說明（備註）
        <span class="word-count" *ngIf="demand.note"> {{ demand.note.length }}/300 </span>
      </label>

      <textarea maxlength="300" placeholder="請編輯其他說明" [(ngModel)]="demand.note"></textarea>

      <hr />
    </div>
  </ng-container>

  <!-- 按鈕 -->
  <div class="button-area">
    <button type="button" class="back-btn" (click)="cancel()">取消</button>

    <button type="button" class="save-btn" (click)="saveAll()">儲存全部修改</button>
  </div>
</div>

<!-- 圖片預覽視窗 -->
<app-supply-image-preview
  *ngIf="showImagePreview"
  [image]="previewImage"
  [imageName]="previewImageName"
  (closed)="closeImagePreview()"
></app-supply-image-preview>
