<div class="container">
  <h1>{{ isEditMode ? '編輯日常需求內容' : '新增日常需求' }}</h1>

  <!-- 編輯模式才顯示需求編號 -->
  <div class="edit-header-info" *ngIf="isEditMode && demand">
    <div class="info-tag">
      <span class="info-label">需求編號</span>
      <span class="info-value">A{{ demand.id }}</span>
    </div>
  </div>

  <div class="form-box">
    <!-- 需求物 -->
    <label class="label-row">
      需求物
      <span class="required">*</span>
      <span class="word-count" *ngIf="demand.item"> {{ demand.item.length }}/150 </span>
    </label>

    <textarea
      #itemInput
      class="item-input"
      maxlength="150"
      [class.error-input]="submitted && !demand.item"
      [placeholder]="isEditMode ? '請編輯需求物' : '請輸入需求物'"
      [(ngModel)]="demand.item"
      (input)="limitTextLength('item', 150)"
    ></textarea>

    <!-- 需求數量 -->
    <label class="label-row">
      需求數量
      <span class="required">*</span>
      <span class="word-count" *ngIf="demand.amount !== null && demand.amount !== undefined">
        {{ demand.amount.toString().length }}/10
      </span>
    </label>

    <div class="quantity-box">
      <input
        #amountInput
        class="short-input"
        [class.error-input]="submitted && !demand.amount"
        type="text"
        maxlength="10"
        inputmode="numeric"
        pattern="[0-9]*"
        [placeholder]="isEditMode ? '請編輯數量' : '請輸入數量'"
        [(ngModel)]="demand.amount"
        (input)="limitNumberLength($event, 'amount')"
      />

      <input
        #unitInput
        class="unit-input"
        [class.error-input]="submitted && !demand.unit"
        maxlength="10"
        type="text"
        placeholder="{{ isEditMode ? '請編輯單位名稱，例如：箱、袋、包' : '單位名稱，例如：箱、袋、包' }}"
        [(ngModel)]="demand.unit"
      />
    </div>

    <!-- 剩餘需求 -->
    <div *ngIf="isEditMode">
      <label class="label-row">
        剩餘需求
        <span class="required">*</span>

        <span class="word-count" *ngIf="demand.remaining !== null && demand.remaining !== undefined">
          {{ demand.remaining.toString().length }}/10
        </span>
      </label>

      <div class="quantity-box">
        <input
          #remainingInput
          class="short-input"
          [class.error-input]="submitted && (demand.remaining === null || demand.remaining === undefined)"
          type="text"
          maxlength="10"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="請輸入目前剩餘需求"
          [(ngModel)]="demand.remaining"
          (input)="limitNumberLength($event, 'remaining')"
        />

        <input class="unit-input" type="text" [value]="demand.unit" disabled />
      </div>
    </div>

    <!-- 數量描述 -->
    <label class="label-row">
      數量描述
      <span class="word-count" *ngIf="demand.amountDescription"> {{ demand.amountDescription.length }}/100 </span>
    </label>

    <div class="short-field">
      <textarea
        maxlength="100"
        [placeholder]="isEditMode ? '請編輯數量描述，例如：1箱內含10包，每包5公斤' : '例如：1箱內含10包，每包5公斤'"
        [(ngModel)]="demand.amountDescription"
        (input)="limitTextLength('amountDescription', 100)"
      ></textarea>
    </div>

    <!-- 可選類別 -->
    <label class="label-row">
      類別
      <span class="required">*</span>
    </label>

    <div class="short-field category-field">
      <div class="custom-select" [class.error-input]="submitted && !demand.category">
        <!-- 顯示目前選擇 -->
        <button #categoryInput type="button" class="custom-select-trigger" (click)="toggleCategoryDropdown()">
          <span>{{ demand.category || '請選擇類別' }}</span>

          <span class="dropdown-arrow">▼</span>
        </button>

        <!-- 下拉選項 -->
        <div class="custom-select-options" *ngIf="categoryDropdownOpen">
          <button type="button" class="custom-option" *ngFor="let category of categoryOptions" (click)="selectCategory(category)">
            {{ category }}
          </button>
        </div>
      </div>
    </div>

    <!-- 需求原因 -->
    <label class="label-row">
      需求原因
      <span class="required">*</span>
      <span class="word-count" *ngIf="demand.reason"> {{ demand.reason.length }}/300 </span>
    </label>

    <textarea
      #reasonInput
      maxlength="300"
      [class.error-input]="submitted && !demand.reason"
      placeholder="{{ isEditMode ? '請編輯需求原因' : '請輸入需求原因' }}"
      [(ngModel)]="demand.reason"
      (input)="limitTextLength('reason', 300)"
    ></textarea>

    <!-- 需求描述 -->
    <label class="label-row">
      需求描述
      <span class="required">*</span>
      <span class="word-count" *ngIf="demand.description"> {{ demand.description.length }}/500 </span>
    </label>

    <textarea
      #descriptionInput
      maxlength="500"
      [class.error-input]="submitted && !demand.description"
      placeholder="{{ isEditMode ? '請編輯需求描述，例如可接受誤差程度、特定型號、款式等' : '請輸入需求描述，例如可接受誤差程度、特定型號、款式等' }}"
      [(ngModel)]="demand.description"
      (input)="limitTextLength('description', 500)"
    ></textarea>

    <!-- 特殊品牌需求 -->
    <label class="label-row">
      特殊品牌需求
      <span class="word-count" *ngIf="demand.brand"> {{ demand.brand.length }}/100 </span>
    </label>

    <textarea
      maxlength="100"
      placeholder="{{ isEditMode ? '請編輯特殊品牌需求，例如：不限品牌、指定品牌、不可接受哪些品牌' : '請輸入特殊品牌需求，例如：不限品牌、指定品牌、不可接受哪些品牌' }}"
      [(ngModel)]="demand.brand"
      (input)="limitTextLength('brand', 100)"
    ></textarea>

    <!-- 物資示意圖片 -->
    <label class="label-row">物資示意圖片</label>

    <div class="image-upload-box">
      <div class="image-upload-area">
        <!-- 未滿 5 張才顯示選擇圖片 -->
        <ng-container *ngIf="imageFiles.length < 5">
          <div class="upload-controls">
            <label class="image-upload-btn">
              <i class="fa-solid fa-image"></i>
              選擇圖片
              <input type="file" accept="image/*" (change)="onImageSelected($event)" />
            </label>

            <span class="image-upload-hint"> 可上傳 JPG、PNG 等圖片，大小上限 5MB </span>
          </div>
        </ng-container>

        <div class="selected-image-list" *ngIf="imageFiles.length > 0">
          <div class="selected-image" *ngFor="let image of imageFiles; let i = index">
            <!-- 圖片名稱：點擊可預覽 -->
            <button type="button" class="selected-image-name" (click)="openImagePreview(demand.image![i], image.name)">
              {{ image.name }}
            </button>

            <button type="button" class="remove-image-btn" (click)="removeImage(i)">移除圖片</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 需求對象區塊 -->
    <div class="service-target-area" [class.error-area]="submitted && !hasServiceTarget">
      <!-- 左側 固定需求對象 -->
      <div class="service-target-section">
        <label class="label-row align-title">
          需求對象
          <span class="required">*</span>
        </label>

        <div class="service-target-box">
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['老人']" /> 老人</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['嬰幼兒']" /> 嬰幼兒</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['孩童']" /> 孩童</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['青少年']" /> 青少年</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['身障']" /> 身障</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['貧困']" /> 貧困</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['重症照護']" /> 重症照護</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['動物']" /> 動物</label>
          <label><input type="checkbox" [(ngModel)]="demand.serviceTargets['無家者']" /> 無家者</label>
        </div>
      </div>

      <!-- 右側 自訂需求對象 -->
      <div class="custom-service-target-section">
        <label class="label-row align-title"> 其他需求對象 </label>

        <div class="custom-service-list">
          <div class="custom-service-row" *ngFor="let target of demand.customServiceTargets; let i = index; trackBy: trackByIndex">
            <input
              class="custom-service-input"
              maxlength="50"
              placeholder="{{ isEditMode ? '請編輯其他需求對象(可自行輸入)' : '請輸入其他需求對象(可自行輸入)' }}"
              [(ngModel)]="demand.customServiceTargets[i]"
            />

            <span class="word-count" *ngIf="target"> {{ target.length }}/50 </span>

            <button
              type="button"
              class="add-condition-btn"
              *ngIf="target && demand.customServiceTargets.length < 5"
              (click)="addCustomServiceTarget()"
            >
              ＋
            </button>

            <button
              type="button"
              class="delete-condition-btn"
              *ngIf="demand.customServiceTargets.length > 1"
              (click)="removeCustomServiceTarget(i)"
            >
              －
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 物資狀態區（完美鏡射上方對齊架構） -->
    <div class="condition-area">
      <!-- 左側  接受物資需求狀態 -->
      <div class="condition-section">
        <label class="label-row align-title condition-title"> 接受物資需求狀態 </label>

        <div class="condition-hint">
          <span class="hint-item">
            初始：
            <span class="hint-icon unset">―</span>
            未設定
          </span>

          <span class="hint-item">
            點一下：
            <span class="hint-icon accept">✔</span>
            接受
          </span>

          <span class="hint-item">
            點兩下：
            <span class="hint-icon reject">✘</span>
            不接受
          </span>
        </div>

        <div class="condition-left">
          <div class="condition-row">
            <span class="condition-name">全新</span>
            <button
              type="button"
              class="condition-toggle"
              [class.accept]="demand.conditions['全新'] === '接受'"
              [class.reject]="demand.conditions['全新'] === '不接受'"
              (click)="toggleCondition('全新')"
            >
              {{ getConditionIcon(demand.conditions['全新']) }}
            </button>
          </div>
          <div class="condition-row">
            <span class="condition-name">二手</span>
            <button
              type="button"
              class="condition-toggle"
              [class.accept]="demand.conditions['二手'] === '接受'"
              [class.reject]="demand.conditions['二手'] === '不接受'"
              (click)="toggleCondition('二手')"
            >
              {{ getConditionIcon(demand.conditions['二手']) }}
            </button>
          </div>
          <div class="condition-row">
            <span class="condition-name">有擦痕</span>
            <button
              type="button"
              class="condition-toggle"
              [class.accept]="demand.conditions['有擦痕'] === '接受'"
              [class.reject]="demand.conditions['有擦痕'] === '不接受'"
              (click)="toggleCondition('有擦痕')"
            >
              {{ getConditionIcon(demand.conditions['有擦痕']) }}
            </button>
          </div>
          <div class="condition-row">
            <span class="condition-name">過期</span>
            <button
              type="button"
              class="condition-toggle"
              [class.accept]="demand.conditions['過期'] === '接受'"
              [class.reject]="demand.conditions['過期'] === '不接受'"
              (click)="toggleCondition('過期')"
            >
              {{ getConditionIcon(demand.conditions['過期']) }}
            </button>
          </div>
          <div class="condition-row">
            <span class="condition-name">毀損</span>
            <button
              type="button"
              class="condition-toggle"
              [class.accept]="demand.conditions['毀損'] === '接受'"
              [class.reject]="demand.conditions['毀損'] === '不接受'"
              (click)="toggleCondition('毀損')"
            >
              {{ getConditionIcon(demand.conditions['毀損']) }}
            </button>
          </div>
        </div>
      </div>

      <!-- 右側 自訂物品狀態（位置與增減方式完全同步） -->
      <div class="custom-condition-section">
        <label class="label-row align-title"> 其它物資需求狀態 </label>

        <div class="custom-condition-list">
          <div class="custom-condition-row" *ngFor="let condition of demand.customConditions; let i = index; trackBy: trackByIndex">
            <input
              class="custom-condition-input"
              maxlength="100"
              type="text"
              placeholder="{{ isEditMode ? '請編輯其它物資需求狀態(可自行輸入)' : '請輸入其它物資需求狀態(可自行輸入)' }}"
              [(ngModel)]="demand.customConditions[i]"
            />

            <span class="word-count" *ngIf="condition"> {{ condition.length }}/100 </span>

            <button
              type="button"
              class="add-condition-btn"
              *ngIf="condition && demand.customConditions.length < 5"
              (click)="addCustomCondition()"
            >
              ＋
            </button>

            <button
              type="button"
              class="delete-condition-btn"
              *ngIf="demand.customConditions.length > 1"
              (click)="removeCustomCondition(i)"
            >
              －
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 緊急優先度 -->
    <label class="label-row align-title">
      緊急優先度
      <span class="required">*</span>

      <span class="priority-limit-info"> 普通：上架60天｜緊急：上架30天｜非常緊急：上架14天 </span>
    </label>

    <div class="priority-box">
      <label class="normal">
        <input type="radio" name="priority" value="普通" [(ngModel)]="demand.priority" />
        普通
      </label>

      <label class="urgent">
        <input type="radio" name="priority" value="緊急" [(ngModel)]="demand.priority" />
        緊急
      </label>

      <label class="very-urgent">
        <input type="radio" name="priority" value="非常緊急" [(ngModel)]="demand.priority" />
        非常緊急
      </label>
    </div>

    <!-- 公開狀態 -->
    <label class="label-row align-title"> 公開狀態 <span class="required">*</span> </label>

    <div class="status-box">
      <label>
        <input type="radio" name="status" value="上架" [(ngModel)]="demand.status" />
        上架
      </label>

      <label>
        <input type="radio" name="status" value="隱藏" [(ngModel)]="demand.status" />
        隱藏
      </label>

      <!-- 編輯模式才顯示下架 -->
      <label *ngIf="isEditMode">
        <input type="radio" name="status" value="下架" [(ngModel)]="demand.status" />
        下架
      </label>
    </div>

    <!-- 接收方式 -->
    <label class="label-row">
      接收方式
      <span class="required">*</span>
    </label>

    <div class="receive-method-box" [class.error-area]="submitted && !hasReceiveMethod">
      <label>
        <input type="checkbox" [(ngModel)]="demand.receiveMethod['寄送']" />
        寄送
      </label>

      <label>
        <input type="checkbox" [(ngModel)]="demand.receiveMethod['面交']" />
        面交
      </label>
    </div>

    <!-- 接收資訊：固定顯示 -->
    <div class="receive-info-box">
      <!-- 收件人 -->
      <label class="label-row">
        收件人
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.recipient"> {{ demand.recipient.length }}/30 </span>
      </label>

      <input
        class="phone-input"
        maxlength="30"
        [class.error-input]="submitted && !demand.recipient"
        type="text"
        placeholder="請輸入收件人姓名"
        [(ngModel)]="demand.recipient"
      />

      <!-- 接收物資地址 -->
      <label class="label-row">
        接收物資地址
        <span class="required">*</span>
        <span class="word-count" *ngIf="demand.address"> {{ demand.address.length }}/35 </span>
      </label>

      <input
        class="medium-input"
        maxlength="35"
        [class.error-input]="submitted && !demand.address"
        type="text"
        placeholder="請輸入能夠接收物資的地址"
        [(ngModel)]="demand.address"
      />
    </div>

    <!-- 聯絡電話 -->
    <label class="label-row">
      聯絡電話
      <span class="required">*</span>
      <span class="word-count" *ngIf="demand.phone"> {{ demand.phone.length }}/30 </span>
    </label>

    <input
      class="phone-input"
      maxlength="30"
      [class.error-input]="submitted && !demand.phone"
      type="tel"
      placeholder="{{ isEditMode ? '請編輯可保持暢通的號碼' : '請輸入可保持暢通的號碼' }}"
      [(ngModel)]="demand.phone"
    />

    <!-- 聯絡時間 -->
    <label class="label-row contact-time-title"> 聯絡時間 </label>

    <div class="contact-time-box">
      <!-- 星期 -->
      <div class="contact-time-section">
        <span class="contact-time-label">日期</span>

        <div class="contact-time-options">
          <label class="time-option">
            <input type="checkbox" value="平日" [(ngModel)]="demand.contactTimeWeekday" />
            平日
          </label>

          <label class="time-option">
            <input type="checkbox" value="假日" [(ngModel)]="demand.contactTimeWeekend" />
            假日
          </label>
        </div>
      </div>

      <!-- 時段 -->
      <div class="contact-time-section">
        <span class="contact-time-label">時段</span>

        <div class="contact-time-options">
          <label class="time-option">
            <input type="checkbox" value="上午" [(ngModel)]="demand.contactTimeMorning" />
            上午
            <span class="time-range">08:00～12:00</span>
          </label>

          <label class="time-option">
            <input type="checkbox" value="下午" [(ngModel)]="demand.contactTimeAfternoon" />
            下午
            <span class="time-range">12:00～18:00</span>
          </label>

          <label class="time-option">
            <input type="checkbox" value="晚上" [(ngModel)]="demand.contactTimeEvening" />
            晚上
            <span class="time-range">18:00～22:00</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 備註 -->
    <label class="label-row">
      其他說明（備註）
      <span class="word-count" *ngIf="demand.note"> {{ demand.note.length }}/300 </span>
    </label>
    <textarea
      class="note-textarea"
      maxlength="300"
      [placeholder]="isEditMode ? '請編輯其他說明' : '請輸入其他說明'"
      [(ngModel)]="demand.note"
      (input)="limitTextLength('note', 300)"
    ></textarea>
  </div>

  <div class="button-area">
    <button class="back-btn" routerLink="/agency/daily">取消</button>
    <button class="save-btn" (click)="save()">{{ isEditMode ? '儲存' : '發布需求' }}</button>
  </div>
</div>

<!-- 圖片預覽視窗 -->
<app-image-preview
  *ngIf="showImagePreview"
  [image]="previewImage"
  [imageName]="previewImageName"
  (closed)="closeImagePreview()"
></app-image-preview>
