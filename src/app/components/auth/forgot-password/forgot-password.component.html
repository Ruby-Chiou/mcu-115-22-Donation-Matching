<!-- 忘記密碼表單（僅限捐助者） -->
<form class="login-form" (ngSubmit)="onSubmit()">
  <div class="form-header">
    <div>
      <h2>重設密碼</h2>
      <p>請輸入電子信箱。我們會由平台客服信箱寄出重設連結（不是第三方系統預設信）。</p>
    </div>
    <button type="button" class="ghost-btn" (click)="backToLogin()">返回登入</button>
  </div>

  <div class="input-grid">
    <label class="field full">
      <span>電子信箱</span>
      <input type="email" [(ngModel)]="forgotPasswordForm.email" name="forgotEmail" required />
    </label>
  </div>

  <div class="actions">
    <div class="action-links">
      <button type="button" class="link-btn" (click)="backToLogin()">返回登入</button>
    </div>
  </div>

  <div class="button-row">
    <button type="submit" class="primary-btn" [disabled]="submitting">{{ submitting ? '寄送中...' : '寄送重設連結' }}</button>
  </div>

  <p class="submit-message" *ngIf="submitMessage" [class.is-error]="isError">{{ submitMessage }}</p>
</form>
