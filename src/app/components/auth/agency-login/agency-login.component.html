<div class="login-container">
  <div class="form-header">
    <div>
      <h2>受助者登入</h2>
      <p>機構經辦人請使用內政部行動自然人憑證完成驗證。同一裝置若有多張憑證，請選擇所屬機構。</p>
    </div>
    <button type="button" class="ghost-btn" (click)="onBackToRoleSelection()">切換身份</button>
  </div>

  @if (gateOpen) {
    <app-natural-person-gate
      [certificates]="certificateCards()"
      (verified)="onCertificateVerified($event)"
      (cancelled)="closeCertificateGate()"
    />
  } @else {
    <div class="cert-intro">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      <div>
        <strong>行動自然人憑證</strong>
        <p>將導向內政部憑證管理中心，確認已啟用的憑證與生物特徵。本平台不會記錄憑證密碼。</p>
      </div>
    </div>
    <div class="button-row">
      <button type="button" class="primary-btn fido-action-btn" (click)="openCertificateGate()" [disabled]="submitting">
        <i class="fa-solid fa-fingerprint"></i>
        使用行動自然人憑證登入
      </button>
    </div>
  }

  @if (submitMessage) {
    <p class="submit-message" [class.is-error]="isError">{{ submitMessage }}</p>
  }
</div>
