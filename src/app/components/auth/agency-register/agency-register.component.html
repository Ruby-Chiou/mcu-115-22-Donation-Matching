<form class="register-form" #agencyFormRef (ngSubmit)="onSubmit()">
  <div class="form-header">
    <div>
      <h2>受助者註冊</h2>
      <p>請填寫機構資料與經辦人資料。資格不會因為點確認信就通過，管理者會到公開可查的社福網站核對，並撥打該網站公布的電話。</p>
    </div>
    <button type="button" class="ghost-btn" (click)="onBackToRoleSelection()">切換身份</button>
  </div>

  <div class="input-grid">
    <label class="field full">
      <span>電子信箱</span>
      <input type="email" [(ngModel)]="agencyForm.email" name="agencyEmail" />
    </label>

    <label class="field full">
      <span>機構名稱</span>
      <input type="text" [(ngModel)]="agencyForm.agencyName" name="agencyAgencyName" />
    </label>

    <label class="field full">
      <span>機構統一編號</span>
      <input type="text" [(ngModel)]="agencyForm.registrationNumber" name="agencyRegistrationNumber" />
    </label>

    <label class="field full">
      <span>負責人姓名</span>
      <input type="text" [(ngModel)]="agencyForm.representative" name="agencyRepresentative" />
    </label>

    <label class="field full">
      <span>機構聯絡電話</span>
      <input type="tel" [(ngModel)]="agencyForm.contactPhone" name="agencyContactPhone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 位數字" />
    </label>

    <label class="field full">
      <span>機構預設地址</span>
      <input type="text" [(ngModel)]="agencyForm.defaultAddress" name="agencyDefaultAddress" />
    </label>

    <!-- 經辦人驗證專用區塊 -->
    <div class="field-group full">
      <h3 class="group-title">經辦人 / 授權自然人資訊（供後續查證使用）</h3>

      <div class="sub-grid">
        <label class="field">
          <span>聯絡人姓名</span>
          <input type="text" [(ngModel)]="agencyForm.contactPersonName" name="contactPersonName" />
        </label>

        <label class="field">
          <span>職稱</span>
          <input type="text" [(ngModel)]="agencyForm.contactPersonTitle" name="contactPersonTitle" placeholder="例如：社工員、總幹事" />
        </label>

        <label class="field">
          <span>所屬部門 / 單位</span>
          <input type="text" [(ngModel)]="agencyForm.department" name="department" placeholder="例如：社會服務部" />
        </label>

        <label class="field">
          <span>聯絡人電話（10 位數字）</span>
          <input type="tel" [(ngModel)]="agencyForm.contactPersonPhone" name="contactPersonPhone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 位數字" />
        </label>

        <label class="field full">
          <span>聯絡人電子信箱</span>
          <input type="email" [(ngModel)]="agencyForm.contactPersonEmail" name="contactPersonEmail" />
        </label>

        <label class="field full">
          <span>授權證明文件（如委託書、職員識別證或大小章切結書）</span>
          <div class="file-upload-wrapper">
            <label for="verificationFileInput" class="custom-file-btn"> <i class="fa-solid fa-cloud-arrow-up"></i> 選擇檔案 </label>
            <input type="file" id="verificationFileInput" name="verificationFileInput" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" (change)="onVerificationFile($event)" />
            <span class="file-name-display"> {{ agencyForm.verificationDocumentUrl || '未選擇任何檔案' }} </span>
          </div>
        </label>

        <label class="field full checkbox-field">
          <input type="checkbox" [(ngModel)]="agencyForm.consentToContact" name="consentToContact" />
          <span>我了解資格確認會對照公開社福查詢網站，並以該網站公布的電話向機構查證，不是點選信箱確認信</span>
        </label>

        <label class="field full checkbox-field">
          <input type="checkbox" [(ngModel)]="agencyForm.agreeToTerms" name="agreeToTerms" />
          <span
            >我已閱讀並同意接受本平台的
            <a routerLink="/legal/service" target="_blank" rel="noopener" class="terms-link">服務條款與隱私權政策</a></span
          >
        </label>
      </div>
    </div>

    <label class="field">
      <span>密碼</span>
      <div class="password-field">
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="agencyForm.password"
          name="agencyPassword"
          minlength="8"
          maxlength="64"
          autocomplete="new-password"
          placeholder="至少 8 碼，含大小寫與數字"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword('password')"
          [attr.aria-label]="showPassword ? '隱藏密碼' : '顯示密碼'"
          [attr.aria-pressed]="showPassword"
        >
          <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
        </button>
      </div>
    </label>

    <label class="field">
      <span>確認密碼</span>
      <div class="password-field">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="agencyForm.confirmPassword"
          name="agencyConfirmPassword"
          minlength="8"
          maxlength="64"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword('confirm')"
          [attr.aria-label]="showConfirmPassword ? '隱藏密碼' : '顯示密碼'"
          [attr.aria-pressed]="showConfirmPassword"
        >
          <i class="fa-solid" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword" aria-hidden="true"></i>
        </button>
      </div>
    </label>
  </div>

  <div class="actions">
    <div class="action-links">
      <a routerLink="/login" class="link-btn">已有帳號？直接登入</a>
    </div>
  </div>

  <div class="button-row">
    <button type="submit" class="primary-btn" [disabled]="submitting">{{ submitting ? '送出中...' : '送出註冊' }}</button>
  </div>

  <p class="submit-message" *ngIf="submitMessage">{{ submitMessage }}</p>
</form>
