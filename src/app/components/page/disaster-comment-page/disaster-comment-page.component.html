<div class="container">
  <!-- 頁面標題 -->
  <div class="page-header">
    <button type="button" class="back-button" (click)="goBack()">
      <span class="arrow">←</span>
      <span>返回災害需求列表</span>
    </button>

    <h1>災害需求留言</h1>
  </div>

  <!-- 載入中 -->
  <div *ngIf="isLoading" class="loading-message">留言載入中...</div>

  <!-- 載入失敗 -->
  <div *ngIf="!isLoading && loadError" class="error-message">{{ loadError }}</div>

  <!-- 留言內容 -->
  <div *ngIf="!isLoading && !loadError" class="comment-section">
    <!-- 沒有留言 -->
    <div *ngIf="commentThreads.length === 0" class="empty-message">目前還沒有留言。</div>
    <!-- 留言串 -->
    <div *ngFor="let thread of commentThreads" class="comment-thread">
      <ng-template #commentNode let-node let-depth="depth" let-rootNode="rootNode">
        <div [ngClass]="depth === 0 ? 'comment' : 'reply'">
          <div class="comment-header">
            <div class="comment-title">
              @if (node.comment.parent_comment_id !== null) {
              <strong>{{ node.comment.user_name }}</strong>
              <span class="reply-title-text">回覆</span>
              <strong class="reply-target-name"> {{ getReplyTargetName(node.comment.parent_comment_id) }} </strong>
              } @else {
              <strong>{{ node.comment.user_name }}</strong>
              }
            </div>
            <span>{{ formatCommentDate(node.comment.created_at) }}</span>
          </div>

          <!-- 留言內容、愛心、回覆按鈕 -->
          <div class="comment-content-row">
            <p class="comment-text">{{ node.comment.content }}</p>

            <div class="comment-actions">
              <button type="button" class="like-button" (click)="toggleLike(node.comment)">
                <span class="material-symbols-outlined" [class.liked]="hasLiked(node.comment)">favorite</span>
                <span>{{ node.comment.like_count || 0 }}</span>
              </button>

              <button type="button" class="comment-button reply-button" (click)="replyTo(node.comment)">回覆</button>
            </div>
          </div>

          <!-- 對這一筆留言回覆的輸入框 -->
          <div *ngIf="replyingTo?.id === node.comment.id" class="reply-form">
            <textarea [(ngModel)]="newComment" rows="3" placeholder="輸入回覆內容..."></textarea>
            <div class="reply-form-actions">
              <button type="button" class="comment-button reply-submit-button" (click)="addComment()">發布回覆</button>
              <button type="button" class="reply-cancel-button" (click)="cancelReply()">取消</button>
            </div>
          </div>

          <!-- 子留言與更深層回覆 -->
          <div *ngIf="node.replies.length > 0" class="reply-list" [class.nested-replies]="depth > 0">
            <ng-container *ngFor="let childNode of node.replies">
              <ng-container
                *ngIf="rootNode.showAllReplies || childNode.comment.id === rootNode.replies[0]?.comment.id"
                [ngTemplateOutlet]="commentNode"
                [ngTemplateOutletContext]="{
      $implicit: childNode,
      depth: depth + 1,
      rootNode: rootNode
    }"
              ></ng-container>
            </ng-container>

            <!-- 只在主留言下方顯示展開按鈕 -->
            <button *ngIf="depth === 0 && countReplies(node) > 1" type="button" class="show-replies-button" (click)="toggleReplies(node)">
              {{ node.showAllReplies ? '收起回覆' : '顯示更多回覆（' + (countReplies(node) - 1) + '）' }}
            </button>
          </div>
        </div>
      </ng-template>

      <ng-container
        [ngTemplateOutlet]="commentNode"
        [ngTemplateOutletContext]="{
      $implicit: thread,
      depth: 0,
      rootNode: thread
    }"
      ></ng-container>
    </div>
  </div>
</div>
