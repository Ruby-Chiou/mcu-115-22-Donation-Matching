<div class="card-list">

  @if (type === 'material') {

    @for (demand of demands; track demand.id) {
      <app-donor-disaster-card
        type="material"
        [demand]="demand"
        [demandId]="demand.id">
      </app-donor-disaster-card>
    }

  } @else {

    @for (volunteer of volunteers; track volunteer.id) {
      <app-donor-disaster-card
        type="volunteer"
        [volunteer]="volunteer">
      </app-donor-disaster-card>
    }

  }

</div>
