<div class="card-list">
  @if (isLoading) {
  <div class="loading-container" role="status" aria-live="polite">
    <div class="loading-spinner"></div>
    <p>資料載入中，請稍候...</p>
  </div>
  } @else if (disasterData().isOpen && type === 'material') { @for ( demand of paginatedDemands; track demand.serialNo ) {
  <app-donor-disaster-card type="material" [demand]="demand" [demandId]="demand.serialNo"></app-donor-disaster-card>
  }

  <app-pagination
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageNumbers]="pageNumbers"
    (pageChange)="goToPage($event)"
  ></app-pagination>
  } @else if ( disasterData().isOpen && type === 'helper' ) { @for ( helper of paginatedHelpers; track helper.serialNo ) {
  <app-donor-disaster-card type="helper" [helper]="helper"></app-donor-disaster-card>
  }

  <app-pagination
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageNumbers]="pageNumbers"
    (pageChange)="goToPage($event)"
  ></app-pagination>
  }
</div>
