<div class="on-shelf-overlay">
  <div class="on-shelf-modal">
    <h2>無法重新上架</h2>
    <p>此需求已手動下架，無法重新上架。</p>

    <p class="warning-text">如需再次上架，請「<span class="hidden-status">重新填寫</span>」需求表單。</p>

    <div class="on-shelf-actions">
      <button type="button" class="confirm-btn" (click)="confirm()">關閉</button>
    </div>
  </div>
</div>
