<app-header></app-header>
<app-thanks-marquee></app-thanks-marquee>

<main class="main-container">
  <app-agency-access-banner />
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

@if (showBackToTop()) {
  <button type="button" class="back-to-top" (click)="backToTop()" aria-label="回到頂端">
    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
    頂端
  </button>
}

@if (closedModal.isVisible()) {
<div class="disaster-closed-modal-backdrop" role="presentation">
  <section
    class="disaster-closed-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="disaster-closed-title"
  >
    <h2 id="disaster-closed-title">急難救助已關閉</h2>
    <p>目前災害救助已結束，暫時無法進行物資捐助或協力報名。</p>
    <button type="button" (click)="goToDisasterLobby()">
      回到災後救助大廳
    </button>
  </section>
</div>
}
