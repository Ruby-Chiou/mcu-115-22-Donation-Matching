@if (mode === 'delete') {
  <div class="modal-backdrop">
    <div class="modal-box">
      <h2>確認刪除</h2>
      <p>{{ message }}</p>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="cancelled.emit()">取消</button>
        <button type="button" class="confirm-btn" (click)="confirmed.emit()">確定刪除</button>
      </div>
    </div>
  </div>
} @else if (mode === 'off-shelf') {
  <div class="off-shelf-overlay">
    <div class="off-shelf-modal">
      <h2>確認手動下架</h2>
      <p>手動下架後，此需求將<strong>無法再次上架</strong>。</p>
      <p class="warning-text">如果之後還想重新上架，請選擇「<span class="hidden-status">隱藏</span>」。</p>
      <p class="system-note">※ 系統依預計下架日期自動下架的需求，之後仍可以重新上架。</p>
      <div class="off-shelf-actions">
        <button type="button" class="back-btn" (click)="cancelled.emit()">取消</button>
        <button type="button" class="hide-btn" (click)="alternate.emit()">隱藏</button>
        <button type="button" class="confirm-off-btn" (click)="confirmed.emit()">確認下架</button>
      </div>
    </div>
  </div>
} @else {
  <div class="on-shelf-overlay">
    <div class="on-shelf-modal">
      <h2>無法重新上架</h2>
      <p>此需求已手動下架，無法重新上架。</p>
      <p class="warning-text">如需再次上架，請「<span class="hidden-status">重新填寫</span>」需求表單。</p>
      <div class="on-shelf-actions">
        <button type="button" class="confirm-btn" (click)="confirmed.emit()">關閉</button>
      </div>
    </div>
  </div>
}
