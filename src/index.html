<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DonationMatching</title>
    <base href="/" />
    <script>
      (function () {
        var baseNode = document.querySelector('base');
        var base = (baseNode && baseNode.getAttribute('href')) || '/';
        if (base.charAt(base.length - 1) !== '/') {
          base += '/';
        }
        var prefix = base === '/' ? '' : base.slice(0, -1);
        var path = location.pathname;
        var rest = path.slice(prefix.length) || '/';
        var isFile = /\/[^/]+\.[A-Za-z0-9]+$/.test(path);
        var saved = sessionStorage.getItem('dm-pages-path');
        if (rest !== '/' && !isFile) {
          sessionStorage.setItem('dm-pages-path', path + location.search + location.hash);
          location.replace(base + location.search + location.hash);
          return;
        }
        if (saved && saved.indexOf(prefix + '/') === 0) {
          sessionStorage.removeItem('dm-pages-path');
          history.replaceState(null, '', saved);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/images/logo_B.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
