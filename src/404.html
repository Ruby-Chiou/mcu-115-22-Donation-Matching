<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>DonationMatching</title>
    <base href="/" />
    <script>
      (function () {
        var baseNode = document.querySelector('base');
        var base = (baseNode && baseNode.getAttribute('href')) || '/';
        if (base.charAt(base.length - 1) !== '/') {
          base += '/';
        }
        var path = location.pathname + location.search + location.hash;
        try {
          sessionStorage.setItem('dm-pages-path', path);
        } catch (e) {}
        location.replace(base + location.search + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <p>頁面載入中…</p>
  </body>
</html>
